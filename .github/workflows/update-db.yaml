name: Update RSS Database

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch: # Allows manual trigger

concurrency:
  group: update-db
  cancel-in-progress: false

jobs:
  update-db:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      contents: write # Commit matcha.db (tracks seen articles)

    steps:
      - name: Checkout repository
        # persist-credentials stays on: this job pushes matcha.db back to main.
        # No artifact is uploaded here, so the token cannot leak via artifacts.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.21'

      - name: Install matcha
        run: |
          go install github.com/piqoni/matcha@main

      - name: Generate daily digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Inject OpenAI API key from secrets into config
          sed -i "s|openai_api_key:.*|openai_api_key: $OPENAI_API_KEY|" matcha.config.yaml

          matcha -c matcha.config.yaml

      - name: Commit database
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Discard the API key injected into the config above.
          git checkout -- matcha.config.yaml

          git add matcha.db
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily digest $(date +'%Y-%m-%d')"
            git push
          fi
