name: Build & Deploy Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'matcha.db'
  workflow_run:
    workflows: ["Update RSS Database"]
    types: [completed]
    branches: [main]
  workflow_dispatch: # Allows manual trigger

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # Deploy when pushed directly, and when the DB-update run finished
    # successfully on main, so a fresh database always reaches the live page.
    if: >-
      ${{
        github.event.workflow_run == null
        || (github.event.workflow_run.conclusion == 'success'
            && github.event.workflow_run.head_branch == 'main')
      }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write # Deploy to GitHub Pages
      id-token: write # Pages OIDC token

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # node:sqlite is available without a flag from Node 24.
          node-version: '24'
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
